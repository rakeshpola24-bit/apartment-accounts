th,td{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}

<script>
'use strict';
var KEY='srinivas-apt-accounts-v1';
var CATS=['Guard salary','Electricity','Water','Lift','Cleaning','Repairs','Generator / diesel','Garden','Other'];
var MODES={cash:'Cash',upi:'UPI',bank:'Bank'};
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function inr(n){n=Math.round(n*100)/100;var neg=n<0;n=Math.abs(n);return (neg?'-':'')+'\u20B9'+n.toLocaleString('en-IN',{maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function curMonth(){return today().slice(0,7)}
function mIdx(m){var p=m.split('-');return +p[0]*12+(+p[1]-1)}
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtMonth(m){var p=m.split('-');return MN[+p[1]-1]+' '+p[0]}
function fmtDate(d){if(!d)return '';var p=d.split('-');return +p[2]+' '+MN[+p[1]-1]+' '+String(p[0]).slice(2)}
function natCmp(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}

/* ---------- calculations (pure) ---------- */
function monthAt(i){return Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0')}
function rateFor(f,m){
  var r=f.rates;if(!r||!r.length)return num(f.amount);
  var best=null;for(var i=0;i<r.length;i++){if(r[i].from<=m&&(!best||r[i].from>=best.from))best=r[i]}
  if(!best){best=r[0];for(var j=1;j<r.length;j++)if(r[j].from<best.from)best=r[j]}
  return num(best.amount);
}
function setRate(f,from,amount){
  var r=(f.rates||[]).filter(function(x){return x.from!==from});
  r.push({from:from,amount:num(amount)});r.sort(function(a,b){return a.from<b.from?-1:a.from>b.from?1:0});
  f.rates=r;f.amount=r[r.length-1].amount;
}
function normFlat(f,startMonth){
  if(!f.rates||!f.rates.length){f.rates=[{from:startMonth||'2000-01',amount:num(f.amount)}]}
  f.amount=rateFor(f,'9999-12');return f;
}
function calc(apt,month){
  var st=apt.startMonth||month, mi=mIdx(month), si=mIdx(st);
  var billedNow=mi>=si?1:0;
  var rows=(apt.flats||[]).map(function(f){
    var amt=rateFor(f,month),paidB=0,paidN=0,dueB=0;
    for(var k=si;k<mi;k++)dueB+=rateFor(f,monthAt(k));
    (apt.payments||[]).forEach(function(p){
      if(p.flatId!==f.id)return;var pm=(p.date||'').slice(0,7);
      if(mIdx(pm)<mi)paidB+=num(p.amount);else if(pm===month)paidN+=num(p.amount);
    });
    var openP=num(f.opening)+dueB-paidB;
    var billed=amt*billedNow;
    return {flat:f,openP:openP,billed:billed,paid:paidN,pending:openP+billed-paidN};
  }).sort(function(a,b){return natCmp(a.flat.no,b.flat.no)});
  var t={billed:0,paid:0,pending:0,advance:0,defaulters:0};
  rows.forEach(function(r){
    t.billed+=r.billed;t.paid+=r.paid;
    if(r.pending>0){t.pending+=r.pending;t.defaulters++}else if(r.pending<0)t.advance+=-r.pending;
  });
  var cashB=num(apt.openCash),bankB=num(apt.openBank),cashN=0,bankN=0,exp=0,expCash=0,expBank=0,recCash=0,recBank=0;
  (apt.payments||[]).forEach(function(p){
    var pm=(p.date||'').slice(0,7),a=num(p.amount),isC=p.mode==='cash';
    if(mIdx(pm)<mi){if(isC)cashB+=a;else bankB+=a}
    else if(pm===month){if(isC){cashN+=a;recCash+=a}else{bankN+=a;recBank+=a}}
  });
  (apt.expenses||[]).forEach(function(e){
    var pm=(e.date||'').slice(0,7),a=num(e.amount),isC=e.mode!=='bank';
    if(mIdx(pm)<mi){if(isC)cashB-=a;else bankB-=a}
    else if(pm===month){exp+=a;if(isC){cashN-=a;expCash+=a}else{bankN-=a;expBank+=a}}
  });
  return {rows:rows,t:t,exp:exp,recCash:recCash,recBank:recBank,expCash:expCash,expBank:expBank,
    cashOpen:cashB,bankOpen:bankB,cashClose:cashB+cashN,bankClose:bankB+bankN,beforeStart:mi<si};
}

/* ---------- storage: Firebase Auth + Firestore ---------- */
var USER_DOMAIN='apartment-accounts.app';
var FB_CONFIG={apiKey:"AIzaSyDfDjB_Dxz30-RjSHHkSrEXwpkvq0cgsqA",authDomain:"apartment-accounts.firebaseapp.com",projectId:"apartment-accounts",storageBucket:"apartment-accounts.firebasestorage.app",messagingSenderId:"677066670634",appId:"1:677066670634:web:827b91c79cddba453d7953"};
var db={v:2,apartments:[],lastBackup:null}, ui={apt:null,month:curMonth(),tab:'sum',rep:null};
try{db.lastBackup=localStorage.getItem('apt-last-backup')||null}catch(e){}
var fb={email:null,store:{},ready:false,aptUnsub:null,subUnsubs:{},shadow:{},aptLoaded:false,fs:null,auth:null};
var META=['name','startMonth','openCash','openBank','ownerEmails','memberEmails'];
function apt(){return db.apartments.filter(function(a){return a.id===ui.apt})[0]}
function flatOf(a,id){return a.flats.filter(function(f){return f.id===id})[0]}
function isOwner(a){return !!a}
function stable(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var r={};Object.keys(v).sort().forEach(function(x){r[x]=v[x]});return r}return v})}
function clean(o,skip){var r={};Object.keys(o).forEach(function(k){if(k==='id'||skip.indexOf(k)>=0||o[k]===undefined)return;r[k]=o[k]});return r}
function flatten(){
  var m={};
  db.apartments.forEach(function(a){
    var meta={};META.forEach(function(k){if(a[k]!==undefined)meta[k]=a[k]});
    m['apartments/'+a.id]=meta;
    ['flats','payments','expenses'].forEach(function(c){(a[c]||[]).forEach(function(x){m['apartments/'+a.id+'/'+c+'/'+x.id]=clean(x,[])})});
  });
  return m;
}
function setSync(t){var e=document.getElementById('syncSt');if(e)e.textContent=t}
var saveTimer=null;
function save(){
  if(!fb.ready){alert('Still loading your data. Wait a moment and try again.');return}
  var now=flatten(),ops=[],k;
  for(k in now){var js=stable(now[k]);if(fb.shadow[k]!==js)ops.push({t:'set',path:k,data:now[k]})}
  for(k in fb.shadow){if(!(k in now))ops.push({t:'del',path:k})}
  if(!ops.length)return;
  var apSet=[],ch=[],apDel=[];
  ops.forEach(function(o){var isApt=o.path.split('/').length===2;
    if(o.t==='set'&&isApt)apSet.push(o);else if(o.t==='del'&&isApt)apDel.push(o);else ch.push(o);
    var pp=o.path.split('/'),aid=pp[1];
    if(o.t==='set'){fb.shadow[o.path]=stable(o.data);
      if(isApt){if(!fb.store[aid])fb.store[aid]={meta:o.data,flats:{},payments:{},expenses:{},loaded:{flats:true,payments:true,expenses:true}};else fb.store[aid].meta=o.data}
      else if(fb.store[aid])fb.store[aid][pp[2]][pp[3]]=o.data}
    else{delete fb.shadow[o.path];
      if(!isApt&&fb.store[aid])delete fb.store[aid][pp[2]][pp[3]]}});
  apDel.forEach(function(o){var aid=o.path.split('/')[1];(fb.subUnsubs[aid]||[]).forEach(function(u){u()});delete fb.subUnsubs[aid];delete fb.store[aid]});
  var batches=[];
  [apSet,ch,apDel].forEach(function(g){for(var i=0;i<g.length;i+=400)batches.push(g.slice(i,i+400))});
  setSync('saving...');
  var chain=Promise.resolve();
  batches.forEach(function(g){
    chain=chain.then(function(){
      var b=fb.fs.batch();
      g.forEach(function(o){var r=fb.fs.doc(o.path);if(o.t==='set')b.set(r,o.data);else b.delete(r)});
      return b.commit();
    });
  });
  chain.then(function(){setSync('saved')}).catch(function(e){
    setSync('NOT saved');
    alert('Could not save to the online database: '+(e&&e.code==='permission-denied'?'you do not have permission for this change.':(e&&e.message)||'network problem')+' The screen will refresh to the saved data.');
    resync();
  });
}
function resync(){var em=fb.email;stopDataKeep();startData(em)}
function stopDataKeep(){if(fb.aptUnsub)fb.aptUnsub();Object.keys(fb.subUnsubs).forEach(function(id){fb.subUnsubs[id].forEach(function(u){u()})});fb.aptUnsub=null;fb.subUnsubs={};fb.store={};fb.shadow={};fb.ready=false;fb.aptLoaded=false}
function toObj(id,data){var o={id:id};Object.keys(data).forEach(function(k){o[k]=data[k]});return o}
function reconcile(list,map,starter){
  var byId={};list.forEach(function(x){byId[x.id]=x});
  var out=[];Object.keys(map).forEach(function(id){
    var cur=byId[id],d=map[id];
    if(cur){Object.keys(cur).forEach(function(k){if(k!=='id')delete cur[k]});Object.keys(d).forEach(function(k){cur[k]=d[k]});out.push(cur)}
    else out.push(toObj(id,d));
  });
  return out;
}
function rebuild(){
  var ids=Object.keys(fb.store),byId={};db.apartments.forEach(function(a){byId[a.id]=a});
  var apts=ids.map(function(id){
    var st=fb.store[id],a=byId[id]||{id:id};
    META.forEach(function(k){delete a[k]});Object.keys(st.meta).forEach(function(k){a[k]=st.meta[k]});
    ['flats','payments','expenses'].forEach(function(c){a[c]=reconcile(a[c]||[],st[c])});
    a.flats.forEach(function(f){normFlat(f,a.startMonth)});
    return a;
  });
  apts.sort(function(x,y){return natCmp(x.name,y.name)});
  db.apartments=apts;
  var all=true;ids.forEach(function(id){var l=fb.store[id].loaded;if(!(l.flats&&l.payments&&l.expenses))all=false});
  fb.ready=fb.aptLoaded&&all;
  if(fb.ready)fb.shadow=(function(){var m=flatten(),r={};for(var k in m)r[k]=stable(m[k]);return r})();
  if(!apt()&&db.apartments.length)ui.apt=db.apartments[0].id;
  if(fb.ready){setSync('online')}else setSync('loading...');
  render();
}
function listenApt(id){
  if(fb.subUnsubs[id])return;
  var us=[];
  ['flats','payments','expenses'].forEach(function(c){
    us.push(fb.fs.collection('apartments/'+id+'/'+c).onSnapshot(function(snap){
      var st=fb.store[id];if(!st)return;var m={};snap.forEach(function(d){m[d.id]=d.data()});st[c]=m;st.loaded[c]=true;rebuild();
    },function(e){setSync('error')}));
  });
  fb.subUnsubs[id]=us;
}
function startData(email){
  fb.email=email;
  setSync('loading...');
  fb.aptUnsub=fb.fs.collection('apartments').onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){var d=ch.doc,st=fb.store[d.id];
      if(ch.type==='removed'){(fb.subUnsubs[d.id]||[]).forEach(function(u){u()});delete fb.subUnsubs[d.id];delete fb.store[d.id];return}
      if(!st){fb.store[d.id]={meta:d.data(),flats:{},payments:{},expenses:{},loaded:{}}}else st.meta=d.data();
      listenApt(d.id)});
    fb.aptLoaded=true;rebuild();
  },function(e){setSync('error');alert('Could not load data: '+e.message)});
}
function stopData(){
  if(fb.aptUnsub)fb.aptUnsub();Object.keys(fb.subUnsubs).forEach(function(id){fb.subUnsubs[id].forEach(function(u){u()})});
  fb.aptUnsub=null;fb.subUnsubs={};fb.store={};fb.shadow={};fb.ready=false;fb.aptLoaded=false;fb.email=null;db.apartments=[];ui.apt=null;
}

/* ---------- login screens ---------- */
function authScreen(html){document.getElementById('authRoot').innerHTML='<div class="auth"><div class="card">'+html+'</div></div>'}
function hideAuth(){document.getElementById('authRoot').innerHTML=''}
function authErr(e){var m={'auth/invalid-credential':'Wrong username or password.','auth/wrong-password':'Wrong username or password.','auth/user-not-found':'Wrong username or password.','auth/invalid-login-credentials':'Wrong username or password.','auth/email-already-in-use':'This email already has an account. Tap Sign in.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Enter a valid email.','auth/popup-closed-by-user':'Sign-in was cancelled.','auth/too-many-requests':'Too many tries. Wait a few minutes.','auth/network-request-failed':'No internet connection.'};return m[e&&e.code]||((e&&e.message)||'Something went wrong.')}
function showLogin(msg){
  authScreen('<h2>Apartment Accounts</h2><p class="hint">Sign in with your username and password.</p>'+
   '<form id="loginForm"><label>Username</label><input name="user" type="text" autocomplete="username" autocapitalize="none" required>'+
   '<label>Password</label><input name="password" type="password" autocomplete="current-password" required>'+
   '<div class="bar" style="margin-top:12px"><button class="btn" type="submit" style="flex:1">Sign in</button></div></form><div class="err" id="authErr">'+esc(msg||'')+'</div>');
  var err=function(e){document.getElementById('authErr').textContent=authErr(e)};
  var f=document.getElementById('loginForm');
  f.onsubmit=function(ev){ev.preventDefault();document.getElementById('authErr').textContent='';fb.auth.signInWithEmailAndPassword(f.user.value.trim().toLowerCase()+'@'+USER_DOMAIN,f.password.value).catch(err)};
}
function showVerify(u){
  authScreen('<h2>Verify your email</h2><p>We sent a link to <b>'+esc(u.email)+'</b>. Open your email, tap the link, then come back here and tap the button below. Check spam if you do not see it.</p>'+
   '<div class="bar"><button class="btn" id="vDone">I have verified</button><button class="btn sec" id="vRe">Resend email</button><button class="btn sec" id="vOut">Sign out</button></div><div class="err" id="authErr"></div>');
  document.getElementById('vDone').onclick=function(){u.reload().then(function(){if(u.emailVerified){return u.getIdToken(true).then(function(){hideAuth();startData(u.email.toLowerCase())})}else document.getElementById('authErr').textContent='Not verified yet. Tap the link in the email first.'})};
  document.getElementById('vRe').onclick=function(){u.sendEmailVerification().then(function(){document.getElementById('authErr').style.color='var(--g)';document.getElementById('authErr').textContent='Sent again.'}).catch(function(e){document.getElementById('authErr').textContent=authErr(e)})};
  document.getElementById('vOut').onclick=function(){fb.auth.signOut()};
}
function initFirebase(){
  firebase.initializeApp(FB_CONFIG);fb.auth=firebase.auth();fb.fs=firebase.firestore();
  authScreen('<p class="hint">Loading...</p>');
  fb.auth.onAuthStateChanged(function(u){
    stopData();render();
    if(!u){showLogin();return}
    hideAuth();startData(u.email.toLowerCase());
  });
}

/* ---------- ui helpers ---------- */
var $=function(s){return document.querySelector(s)};
function sheet(title,html,onSave,opts){
  opts=opts||{};
  var root=$('#sheetRoot');
  root.innerHTML='<div class="sheet-bg"><form class="sheet"><h3>'+esc(title)+'</h3>'+html+
   '<div class="bar"><button class="btn" type="submit">'+(opts.saveLabel||'Save')+'</button><button class="btn sec" type="button" data-close>Cancel</button>'+
   (opts.del?'<button class="btn red" type="button" data-del>Delete</button>':'')+'</div></form></div>';
  var form=root.querySelector('form');
  root.querySelector('.sheet-bg').addEventListener('click',function(e){if(e.target.classList.contains('sheet-bg'))closeSheet()});
  form.querySelector('[data-close]').onclick=closeSheet;
  if(opts.del)form.querySelector('[data-del]').onclick=function(){if(confirm('Delete this? This cannot be undone.')){opts.del();closeSheet();render()}};
  form.onsubmit=function(e){e.preventDefault();var fd={};new FormData(form).forEach(function(v,k){fd[k]=v});
    if(onSave(fd)!==false){closeSheet();render()}};
}
function closeSheet(){$('#sheetRoot').innerHTML=''}
function field(name,label,val,type,extra){
  return '<label>'+label+'</label><input name="'+name+'" type="'+(type||'text')+'" value="'+esc(val)+'" '+(extra||'')+'>';
}
function selectF(name,label,opts,val){
  return '<label>'+label+'</label><select name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';

function monthsBetween(from,to){var r=[];for(var i=mIdx(from);i<=mIdx(to);i++)r.push(monthAt(i));return r}
function repPeriods(a){
  var y0=+a.startMonth.slice(0,4),y1=+curMonth().slice(0,4)+1,out=[];
  for(var y=y1;y>=y0-1;y--){
    out.push({k:'fy'+y,label:'Financial year '+y+'-'+String(y+1).slice(2)+' (Apr '+y+' - Mar '+(y+1)+')',from:y+'-04',to:(y+1)+'-03'});
    out.push({k:'cy'+y,label:'Calendar year '+y+' (Jan - Dec)',from:y+'-01',to:y+'-12'});
  }
  return out;
}
function repData(a,from,to){
  var ms=monthsBetween(from,to),rows=[],tot={billed:0,paid:0,exp:0},flats={},cats={};
  ms.forEach(function(m){var c=calc(a,m);rows.push({m:m,billed:c.t.billed,paid:c.t.paid,exp:c.exp,cash:c.cashClose,bank:c.bankClose,pend:c.t.pending,adv:c.t.advance});
    tot.billed+=c.t.billed;tot.paid+=c.t.paid;tot.exp+=c.exp;
    c.rows.forEach(function(r){var x=flats[r.flat.id]||(flats[r.flat.id]={flat:r.flat,billed:0,paid:0});x.billed+=r.billed;x.paid+=r.paid})});
  var pays=a.payments.filter(function(p){var m=(p.date||'').slice(0,7);return m>=from&&m<=to}).sort(function(x,y){return (x.date||'').localeCompare(y.date||'')||natCmp(x.receipt,y.receipt)});
  var exps=a.expenses.filter(function(e){var m=(e.date||'').slice(0,7);return m>=from&&m<=to}).sort(function(x,y){return (x.date||'').localeCompare(y.date||'')});
  exps.forEach(function(e){cats[e.cat]=(cats[e.cat]||0)+num(e.amount)});
  var first=calc(a,from),last=calc(a,to);
  var fl=Object.keys(flats).map(function(k){var x=flats[k],r=last.rows.filter(function(q){return q.flat.id===k})[0];x.pending=r?r.pending:0;return x}).sort(function(x,y){return natCmp(x.flat.no,y.flat.no)});
  return {ms:ms,rows:rows,tot:tot,pays:pays,exps:exps,cats:cats,flats:fl,first:first,last:last};
}

function flatSheet(f){
  var a=apt(),isNew=!f;f=f||{no:'',owner:'',phone:'',kind:'owner',amount:a.flats.length?rateFor(a.flats[a.flats.length-1],ui.month):2000,opening:0};

   selectF('kind','Occupied by',[['owner','Owner'],['tenant','Tenant']],f.kind||'owner')+
   field('amount','Monthly maintenance (\u20B9)',isNew?f.amount:rateFor(f,ui.month),'number','step="any" required')+
   (isNew?'':field('from','If amount changed, applies from month',ui.month<a.startMonth?a.startMonth:ui.month,'month','required')+'<div class="hint">A changed amount applies from this month onward. Earlier months keep the old amount.</div>')+
   field('opening','Old pending before start month (\u20B9)',f.opening||0,'number','step="any"')+'<div class="hint">Use a negative number if the flat paid in advance.</div>',function(d){
    var no=d.no.trim();if(a.flats.some(function(x){return x.no===no&&x!==f})){alert('Flat '+no+' already exists.');return false}
    f.no=no;f.owner=d.owner.trim();f.phone=d.phone.trim();f.kind=d.kind;f.opening=num(d.opening);
    if(isNew){f.id=uid();f.amount=num(d.amount);normFlat(f,a.startMonth);a.flats.push(f)}
    else if(Math.abs(rateFor(f,d.from)-num(d.amount))>0.001){if(d.from<a.startMonth){alert('Pick a month on or after the start month.');return false}setRate(f,d.from,d.amount)}
    save()},
   {del:isNew?null:function(){if(a.payments.some(function(p){return p.flatId===f.id})&&!confirm('This flat has payments recorded. They will be deleted too. Continue?'))return;a.payments=a.payments.filter(function(p){return p.flatId!==f.id});a.flats=a.flats.filter(function(x){return x!==f});save()}});
}
function nextReceipt(a){var m=0;a.payments.forEach(function(p){var n=parseInt(p.receipt,10);if(isFinite(n)&&String(n)===String(p.receipt).trim()&&n>m)m=n});return m?String(m+1):''}
