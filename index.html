<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f5f4a">
<title>Apartment Accounts</title>
<style>
*{box-sizing:border-box}
:root{--g:#1f5f4a;--g2:#e6f2ed;--r:#b3261e;--r2:#fbeae8;--a:#9a6700;--a2:#fff4d6;--t:#1b1f1d;--m:#667069;--b:#dfe4e1;--bg:#f5f7f6}
body{margin:0;font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:var(--bg);padding-bottom:76px}
header{background:var(--g);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:5}
header .row{display:flex;gap:8px;align-items:center}
header select,header input{flex:1;min-width:0;font-size:16px;padding:9px;border-radius:8px;border:0;background:#fff;color:var(--t)}
header h1{font-size:15px;margin:0 0 6px;font-weight:600;opacity:.9}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--m);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--m)}
.stat.good b{color:var(--g)}.stat.bad b{color:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:12px;color:var(--m)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--g);font-weight:700}
button.btn,a.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;text-decoration:none;cursor:pointer}
button.btn.sec,a.btn.sec{background:var(--g2);color:var(--g)}
button.btn.red{background:var(--r2);color:var(--r)}
button.btn.sm,a.btn.sm{padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--b);align-items:center}
.item:last-child{border:0}
.item small{color:var(--m);display:block}
.item .amt{font-weight:600;white-space:nowrap;text-align:right}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--g2);color:var(--g);white-space:nowrap}
.tag.r{background:var(--r2);color:var(--r)}.tag.a{background:var(--a2);color:var(--a)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}
th{color:var(--m);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.empty{color:var(--m);text-align:center;padding:24px 8px}
.warn{background:var(--a2);color:var(--a);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h3{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 3px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--b);border-radius:8px;background:#fff;font-family:inherit}
.sheet .bar{margin:14px 0 0}
.hint{font-size:12px;color:var(--m);margin-top:3px}
.print-only{display:none}
@media print{header,nav,.bar,.noprint,.sheet-bg,button,.btn{display:none!important}body{background:#fff;padding:0}.card{border:0;padding:0}.print-only{display:block}main{max-width:none}}
</style>
</head>
<body>
<header class="noprint">
<h1>Srinivas Services - Apartment Accounts</h1>
<div class="row"><select id="aptSel" aria-label="Apartment"></select><input type="month" id="monthSel" aria-label="Month"></div>
</header>
<main id="main"></main>
<nav class="noprint" id="nav">
<button data-tab="sum"><b>&#128202;</b>Summary</button>
<button data-tab="pay"><b>&#8377;</b>Payments</button>
<button data-tab="exp"><b>&#8722;</b>Expenses</button>
<button data-tab="flat"><b>&#127968;</b>Flats</button>
<button data-tab="more"><b>&#9881;</b>More</button>
</nav>
<div id="sheetRoot"></div>
<script>
'use strict';
var KEY='srinivas-apt-accounts-v1';
var CATS=['Guard salary','Electricity','Water','Lift','Cleaning','Repairs','Generator / diesel','Garden','Other'];
var MODES={cash:'Cash',upi:'UPI',bank:'Bank'};
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function inr(n){n=Math.round(n*100)/100;var neg=n<0;n=Math.abs(n);return (neg?'-':'')+'\u20B9'+n.toLocaleString('en-IN',{maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function curMonth(){return today().slice(0,7)}
function mIdx(m){var p=m.split('-');return +p[0]*12+(+p[1]-1)}
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtMonth(m){var p=m.split('-');return MN[+p[1]-1]+' '+p[0]}
function fmtDate(d){if(!d)return '';var p=d.split('-');return +p[2]+' '+MN[+p[1]-1]+' '+String(p[0]).slice(2)}
function natCmp(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}

/* ---------- calculations (pure) ---------- */
function calc(apt,month){
  var st=apt.startMonth||month, mi=mIdx(month), si=mIdx(st);
  var before=Math.max(0,mi-si), billedNow=mi>=si?1:0;
  var rows=(apt.flats||[]).map(function(f){
    var amt=num(f.amount),paidB=0,paidN=0;
    (apt.payments||[]).forEach(function(p){
      if(p.flatId!==f.id)return;var pm=(p.date||'').slice(0,7);
      if(mIdx(pm)<mi)paidB+=num(p.amount);else if(pm===month)paidN+=num(p.amount);
    });
    var openP=num(f.opening)+amt*before-paidB;
    var billed=amt*billedNow;
    return {flat:f,openP:openP,billed:billed,paid:paidN,pending:openP+billed-paidN};
  }).sort(function(a,b){return natCmp(a.flat.no,b.flat.no)});
  var t={billed:0,paid:0,pending:0,advance:0,defaulters:0};
  rows.forEach(function(r){
    t.billed+=r.billed;t.paid+=r.paid;
    if(r.pending>0){t.pending+=r.pending;t.defaulters++}else if(r.pending<0)t.advance+=-r.pending;
  });
  var cashB=num(apt.openCash),bankB=num(apt.openBank),cashN=0,bankN=0,exp=0,expCash=0,expBank=0,recCash=0,recBank=0;
  (apt.payments||[]).forEach(function(p){
    var pm=(p.date||'').slice(0,7),a=num(p.amount),isC=p.mode==='cash';
    if(mIdx(pm)<mi){if(isC)cashB+=a;else bankB+=a}
    else if(pm===month){if(isC){cashN+=a;recCash+=a}else{bankN+=a;recBank+=a}}
  });
  (apt.expenses||[]).forEach(function(e){
    var pm=(e.date||'').slice(0,7),a=num(e.amount),isC=e.mode!=='bank';
    if(mIdx(pm)<mi){if(isC)cashB-=a;else bankB-=a}
    else if(pm===month){exp+=a;if(isC){cashN-=a;expCash+=a}else{bankN-=a;expBank+=a}}
  });
  return {rows:rows,t:t,exp:exp,recCash:recCash,recBank:recBank,expCash:expCash,expBank:expBank,
    cashOpen:cashB,bankOpen:bankB,cashClose:cashB+cashN,bankClose:bankB+bankN,beforeStart:mi<si};
}

/* ---------- storage ---------- */
var db=load(), ui={apt:null,month:curMonth(),tab:'sum'};
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.apartments)return d}catch(e){}
  return {v:1,apartments:[],lastBackup:null};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save. Browser storage may be full or blocked.')}}
function apt(){return db.apartments.filter(function(a){return a.id===ui.apt})[0]}
function flatOf(a,id){return a.flats.filter(function(f){return f.id===id})[0]}

/* ---------- ui helpers ---------- */
var $=function(s){return document.querySelector(s)};
function sheet(title,html,onSave,opts){
  opts=opts||{};
  var root=$('#sheetRoot');
  root.innerHTML='<div class="sheet-bg"><form class="sheet"><h3>'+esc(title)+'</h3>'+html+
   '<div class="bar"><button class="btn" type="submit">'+(opts.saveLabel||'Save')+'</button><button class="btn sec" type="button" data-close>Cancel</button>'+
   (opts.del?'<button class="btn red" type="button" data-del>Delete</button>':'')+'</div></form></div>';
  var form=root.querySelector('form');
  root.querySelector('.sheet-bg').addEventListener('click',function(e){if(e.target.classList.contains('sheet-bg'))closeSheet()});
  form.querySelector('[data-close]').onclick=closeSheet;
  if(opts.del)form.querySelector('[data-del]').onclick=function(){if(confirm('Delete this? This cannot be undone.')){opts.del();closeSheet();render()}};
  form.onsubmit=function(e){e.preventDefault();var fd={};new FormData(form).forEach(function(v,k){fd[k]=v});
    if(onSave(fd)!==false){closeSheet();render()}};
}
function closeSheet(){$('#sheetRoot').innerHTML=''}
function field(name,label,val,type,extra){
  return '<label>'+label+'</label><input name="'+name+'" type="'+(type||'text')+'" value="'+esc(val)+'" '+(extra||'')+'>';
}
function selectF(name,label,opts,val){
  return '<label>'+label+'</label><select name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
}
function modeOpts(){return Object.keys(MODES).map(function(k){return [k,MODES[k]]})}
function waLink(phone,text){var d=String(phone||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d?'https://wa.me/'+d+'?text='+encodeURIComponent(text):''}
function dl(name,mime,content){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}

/* ---------- render ---------- */
function render(){
  var sel=$('#aptSel');
  if(!db.apartments.length){sel.innerHTML='<option>No apartment yet</option>';ui.apt=null}
  else{
    if(!apt())ui.apt=db.apartments[0].id;
    sel.innerHTML=db.apartments.map(function(a){return '<option value="'+a.id+'"'+(a.id===ui.apt?' selected':'')+'>'+esc(a.name)+'</option>'}).join('');
  }
  $('#monthSel').value=ui.month;
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===ui.tab)});
  var m=$('#main');
  if(!apt()&&ui.tab!=='more'){m.innerHTML=welcome();return}
  m.innerHTML=({sum:vSum,pay:vPay,exp:vExp,flat:vFlat,more:vMore})[ui.tab]();
}
function welcome(){
  return '<div class="card"><h2>Welcome</h2><p>Add your first apartment to start. You can add more apartments later and switch from the top.</p>'+
  '<button class="btn" data-act="addApt">+ Add apartment</button></div>'+
  '<div class="card"><h2>Already have a backup?</h2><button class="btn sec" data-act="import">Restore from backup file</button></div>';
}
function backupWarn(){
  if(!db.apartments.length)return '';
  var last=db.lastBackup?new Date(db.lastBackup):null,days=last?(Date.now()-last)/864e5:999;
  if(days<7)return '';
  return '<div class="warn noprint">Data is saved only in this browser. '+(last?'Last backup '+Math.floor(days)+' days ago.':'No backup yet.')+' <a href="#" data-act="export">Download backup</a></div>';
}
function vSum(){
  var a=apt(),c=calc(a,ui.month),t=c.t,h=backupWarn();
  if(c.beforeStart)h+='<div class="warn">This month is before the start month ('+fmtMonth(a.startMonth)+'). Billing begins from the start month. Change it in More.</div>';
  h+='<div class="card"><h2>'+esc(a.name)+' - '+fmtMonth(ui.month)+'</h2><div class="grid">'+
   '<div class="stat"><span>Billed</span><b>'+inr(t.billed)+'</b></div>'+
   '<div class="stat good"><span>Collected</span><b>'+inr(t.paid)+'</b></div>'+
   '<div class="stat bad"><span>Pending (all dues)</span><b>'+inr(t.pending)+'</b></div>'+
   '<div class="stat"><span>Expenses</span><b>'+inr(c.exp)+'</b></div>'+
   '<div class="stat"><span>Closing cash</span><b>'+inr(c.cashClose)+'</b></div>'+
   '<div class="stat"><span>Closing bank / UPI</span><b>'+inr(c.bankClose)+'</b></div></div>'+
   '<p class="hint">Opening cash '+inr(c.cashOpen)+' + received '+inr(c.recCash)+' - spent '+inr(c.expCash)+'. Opening bank '+inr(c.bankOpen)+' + received '+inr(c.recBank)+' - spent '+inr(c.expBank)+'.'+(t.advance?' Advance held: '+inr(t.advance)+'.':'')+'</p></div>';
  var d=c.rows.filter(function(r){return r.pending>0});
  h+='<div class="card"><h2>Defaulters ('+d.length+')</h2>';
  if(!c.rows.length)h+='<div class="empty">No flats yet. Add them in Flats.</div>';
  else if(!d.length)h+='<div class="empty">Nobody pending. &#127881;</div>';
  d.sort(function(x,y){return y.pending-x.pending}).forEach(function(r){
    var f=r.flat,wa=waLink(f.phone,'Hello'+(f.owner?' '+f.owner:'')+', maintenance of '+inr(r.pending)+' is pending for flat '+f.no+' at '+a.name+' (till '+fmtMonth(ui.month)+'). Please pay at the earliest. - Srinivas Services');
    h+='<div class="item"><div><b>Flat '+esc(f.no)+'</b> '+esc(f.owner||'')+'<small>'+esc(f.phone||'no phone')+'</small></div><div class="amt">'+inr(r.pending)+'<br>'+
      '<button class="btn sm" data-act="payFor" data-id="'+f.id+'">Add payment</button>'+(wa?' <a class="btn sm sec" target="_blank" rel="noopener" href="'+wa+'">WhatsApp</a>':'')+'</div></div>';
  });
  h+='</div>';
  h+='<div class="card"><h2>Flat-wise - '+fmtMonth(ui.month)+'</h2>';
  if(c.rows.length){
    h+='<table><tr><th>Flat</th><th class="n">Earlier due</th><th class="n">Billed</th><th class="n">Paid</th><th class="n">Pending</th></tr>';
    c.rows.forEach(function(r){var p=r.pending;
      h+='<tr><td>'+esc(r.flat.no)+(r.flat.owner?'<br><small style="color:#667069">'+esc(r.flat.owner)+'</small>':'')+'</td><td class="n">'+inr(r.openP)+'</td><td class="n">'+inr(r.billed)+'</td><td class="n">'+inr(r.paid)+'</td><td class="n"><b style="color:'+(p>0?'var(--r)':'var(--g)')+'">'+inr(p)+'</b></td></tr>'});
    h+='<tr><th>Total</th><th></th><th class="n">'+inr(t.billed)+'</th><th class="n">'+inr(t.paid)+'</th><th class="n">'+inr(t.pending)+'</th></tr></table>';
    h+='<p class="hint">Negative pending = paid in advance.</p>';
  }else h+='<div class="empty">No flats yet.</div>';
  h+='<div class="bar noprint" style="margin-top:12px"><button class="btn sec" data-act="print">Print / save PDF</button><button class="btn sec" data-act="csv">Download CSV</button></div></div>';
  return h;
}
function monthPays(a){return a.payments.filter(function(p){return (p.date||'').slice(0,7)===ui.month}).sort(function(x,y){return (y.date||'').localeCompare(x.date||'')})}
function vPay(){
  var a=apt(),list=monthPays(a),tot=0;list.forEach(function(p){tot+=num(p.amount)});
  var h='<div class="bar"><button class="btn" data-act="addPay">+ Add payment</button></div><div class="card"><h2>Payments - '+fmtMonth(ui.month)+' ('+inr(tot)+')</h2>';
  if(!a.flats.length)h+='<div class="empty">Add flats first.</div>';
  else if(!list.length)h+='<div class="empty">No payments this month.</div>';
  list.forEach(function(p){var f=flatOf(a,p.flatId);
    h+='<div class="item" data-act="editPay" data-id="'+p.id+'"><div><b>Flat '+esc(f?f.no:'?')+'</b> '+esc(f?f.owner:'')+'<small>'+fmtDate(p.date)+' &middot; <span class="tag">'+MODES[p.mode]+'</span>'+(p.receipt?' &middot; Rcpt '+esc(p.receipt):'')+(p.ref?' &middot; '+esc(p.ref):'')+'</small></div><div class="amt">'+inr(num(p.amount))+'</div></div>'});
  return h+'</div>';
}
function vExp(){
  var a=apt(),list=a.expenses.filter(function(e){return (e.date||'').slice(0,7)===ui.month}).sort(function(x,y){return (y.date||'').localeCompare(x.date||'')}),tot=0;
  list.forEach(function(e){tot+=num(e.amount)});
  var h='<div class="bar"><button class="btn" data-act="addExp">+ Add expense</button></div><div class="card"><h2>Expenses - '+fmtMonth(ui.month)+' ('+inr(tot)+')</h2>';
  if(!list.length)h+='<div class="empty">No expenses this month.</div>';
  list.forEach(function(e){
    h+='<div class="item" data-act="editExp" data-id="'+e.id+'"><div><b>'+esc(e.cat)+'</b><small>'+fmtDate(e.date)+' &middot; <span class="tag">'+(e.mode==='bank'?'Bank':'Cash')+'</span>'+(e.note?' &middot; '+esc(e.note):'')+'</small></div><div class="amt">'+inr(num(e.amount))+'</div></div>'});
  return h+'</div>';
}
function vFlat(){
  var a=apt(),c=calc(a,ui.month),h='<div class="bar"><button class="btn" data-act="addFlat">+ Add flat</button><button class="btn sec" data-act="addMany">Add many</button><button class="btn sec" data-act="setAll">Set amount for all</button></div>';
  h+='<div class="card"><h2>'+a.flats.length+' flats - '+esc(a.name)+'</h2>';
  if(!c.rows.length)h+='<div class="empty">No flats yet. Use "Add many" to create all at once.</div>';
  c.rows.forEach(function(r){var f=r.flat,p=r.pending;
    h+='<div class="item" data-act="editFlat" data-id="'+f.id+'"><div><b>Flat '+esc(f.no)+'</b> '+esc(f.owner||'')+(f.kind==='tenant'?' <span class="tag a">Tenant</span>':'')+'<small>'+esc(f.phone||'no phone')+'</small></div><div class="amt">'+inr(num(f.amount))+'/mo<br><span class="tag '+(p>0?'r':'')+'">'+(p>0?'Pending '+inr(p):p<0?'Advance '+inr(-p):'Clear')+'</span></div></div>'});
  return h+'</div>';
}
function vMore(){
  var a=apt(),h='';
  if(a)h+='<div class="card"><h2>'+esc(a.name)+'</h2><p class="hint">Starts '+fmtMonth(a.startMonth)+' &middot; opening cash '+inr(num(a.openCash))+' &middot; opening bank '+inr(num(a.openBank))+'</p><button class="btn sec" data-act="editApt">Edit apartment / opening balances</button></div>';
  h+='<div class="card"><h2>Apartments</h2><button class="btn" data-act="addApt">+ Add apartment</button></div>';
  h+='<div class="card"><h2>Backup</h2><p class="hint">All data is stored only in this browser on this device. Download a backup regularly and keep it safe (e.g. WhatsApp it to yourself). Restore it on any device.'+(db.lastBackup?' Last backup: '+new Date(db.lastBackup).toLocaleString('en-IN'):' No backup yet.')+'</p>'+
   '<div class="bar"><button class="btn" data-act="export">Download backup</button><button class="btn sec" data-act="import">Restore backup</button></div></div>';
  h+='<div class="card"><h2>How to use</h2><ol style="padding-left:18px;margin:0"><li>Add apartment, then its flats (Add many).</li><li>Record every payment and expense as it happens.</li><li>Pick the month on top; Summary shows collected, pending, defaulters and balances.</li><li>Download a backup weekly.</li></ol><p class="hint">Pending carries forward automatically month to month.</p></div>';
  return h;
}

/* ---------- actions ---------- */
function aptForm(a){
  a=a||{};
  return field('name','Apartment name',a.name||'','text','required')+
   field('startMonth','Accounts start from (month)',a.startMonth||curMonth(),'month','required')+
   field('openCash','Opening cash in hand (\u20B9)',a.openCash||0,'number','step="any"')+
   field('openBank','Opening bank balance (\u20B9)',a.openBank||0,'number','step="any"')+
   '<div class="hint">Opening balances are as of the start month. Dues begin from the start month; put older pending in each flat.</div>';
}
var acts={
  addApt:function(){sheet('Add apartment',aptForm(),function(f){var a={id:uid(),name:f.name.trim(),startMonth:f.startMonth,openCash:num(f.openCash),openBank:num(f.openBank),flats:[],payments:[],expenses:[]};db.apartments.push(a);ui.apt=a.id;ui.month=a.startMonth>curMonth()?a.startMonth:curMonth();ui.tab='flat';save()})},
  editApt:function(){var a=apt();sheet('Edit apartment',aptForm(a),function(f){a.name=f.name.trim();a.startMonth=f.startMonth;a.openCash=num(f.openCash);a.openBank=num(f.openBank);save()},{del:function(){db.apartments=db.apartments.filter(function(x){return x!==a});ui.apt=null;save()}})},
  addFlat:function(){flatSheet()},
  editFlat:function(el){flatSheet(flatOf(apt(),el.dataset.id))},
  addMany:function(){
    var a=apt();sheet('Add many flats',field('count','How many flats',a.flats.length?'':32,'number','min="1" max="300" required')+field('prefix','Flat number prefix (optional)','','text','placeholder="e.g. A-"')+field('start','Start number',101,'number','required')+field('amount','Monthly maintenance per flat (\u20B9)',2000,'number','step="any" required')+'<div class="hint">Creates numbered flats, e.g. 101, 102, 103... You can rename any flat afterwards. Existing flat numbers are skipped.</div>',function(f){
      var n=Math.min(300,Math.max(1,parseInt(f.count,10)||0)),s=parseInt(f.start,10)||1,added=0;
      for(var i=0;i<n;i++){var no=(f.prefix||'')+(s+i);if(a.flats.some(function(x){return x.no===no}))continue;a.flats.push({id:uid(),no:no,owner:'',phone:'',kind:'owner',amount:num(f.amount),opening:0});added++}
      save();alert(added+' flats added.')})
  },
  setAll:function(){var a=apt();sheet('Set amount for all flats',field('amount','Monthly maintenance (\u20B9)',a.flats[0]?a.flats[0].amount:2000,'number','step="any" required')+'<div class="hint">Changes the monthly amount of every flat. Past months are recalculated with the new amount, so use this only when rates change for the whole apartment.</div>',function(f){a.flats.forEach(function(x){x.amount=num(f.amount)});save()})},
  addPay:function(){paySheet()},
  payFor:function(el){var a=apt(),r=calc(a,ui.month).rows.filter(function(r){return r.flat.id===el.dataset.id})[0];paySheet(null,el.dataset.id,r&&r.pending>0?r.pending:'')},
  editPay:function(el){paySheet(apt().payments.filter(function(p){return p.id===el.dataset.id})[0])},
  addExp:function(){expSheet()},
  editExp:function(el){expSheet(apt().expenses.filter(function(p){return p.id===el.dataset.id})[0])},
  export:function(){db.lastBackup=new Date().toISOString();save();dl('apartment-accounts-backup-'+today()+'.json','application/json',JSON.stringify(db,null,1));render()},
  import:function(){var i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=function(){var fr=new FileReader();fr.onload=function(){
      try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.apartments))throw 0;
        d.apartments.forEach(function(a){a.flats=a.flats||[];a.payments=a.payments||[];a.expenses=a.expenses||[]});
        if(confirm('Replace all current data with this backup ('+d.apartments.length+' apartments)?')){db=d;ui.apt=null;save();render()}
      }catch(e){alert('This file is not a valid backup.')}};fr.readAsText(i.files[0])};i.click()},
  print:function(){window.print()},
  csv:function(){var a=apt(),c=calc(a,ui.month),q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
    var out=[['Flat','Owner','Phone','Earlier due','Billed','Paid','Pending']].concat(c.rows.map(function(r){return [r.flat.no,r.flat.owner,r.flat.phone,r.openP,r.billed,r.paid,r.pending]}));
    dl(a.name+'-'+ui.month+'.csv','text/csv',out.map(function(r){return r.map(q).join(',')}).join('\n'))}
};
function flatSheet(f){
  var a=apt(),isNew=!f;f=f||{no:'',owner:'',phone:'',kind:'owner',amount:a.flats.length?a.flats[a.flats.length-1].amount:2000,opening:0};
  sheet(isNew?'Add flat':'Edit flat '+f.no,field('no','Flat number',f.no,'text','required')+field('owner','Name (owner / tenant)',f.owner)+field('phone','Phone',f.phone,'tel','inputmode="tel"')+
   selectF('kind','Occupied by',[['owner','Owner'],['tenant','Tenant']],f.kind||'owner')+
   field('amount','Monthly maintenance (\u20B9)',f.amount,'number','step="any" required')+
   field('opening','Old pending before start month (\u20B9)',f.opening||0,'number','step="any"')+'<div class="hint">Use a negative number if the flat paid in advance.</div>',function(d){
    var no=d.no.trim();if(a.flats.some(function(x){return x.no===no&&x!==f})){alert('Flat '+no+' already exists.');return false}
    f.no=no;f.owner=d.owner.trim();f.phone=d.phone.trim();f.kind=d.kind;f.amount=num(d.amount);f.opening=num(d.opening);
    if(isNew){f.id=uid();a.flats.push(f)}save()},
   {del:isNew?null:function(){if(a.payments.some(function(p){return p.flatId===f.id})&&!confirm('This flat has payments recorded. They will be deleted too. Continue?'))return;a.payments=a.payments.filter(function(p){return p.flatId!==f.id});a.flats=a.flats.filter(function(x){return x!==f});save()}});
}
function nextReceipt(a){var m=0;a.payments.forEach(function(p){var n=parseInt(p.receipt,10);if(isFinite(n)&&String(n)===String(p.receipt).trim()&&n>m)m=n});return m?String(m+1):''}
function paySheet(p,flatId,amt){
  var a=apt(),isNew=!p;
  if(!a.flats.length){alert('Add flats first.');return}
  p=p||{flatId:flatId||'',date:(ui.month===curMonth()?today():ui.month+'-01'),amount:amt||'',mode:'cash',receipt:nextReceipt(a),ref:''};
  var opts=a.flats.slice().sort(function(x,y){return natCmp(x.no,y.no)}).map(function(f){return [f.id,'Flat '+f.no+(f.owner?' - '+f.owner:'')]});
  sheet(isNew?'Add payment':'Edit payment',selectF('flatId','Flat',opts,p.flatId||opts[0][0])+field('amount','Amount received (\u20B9)',p.amount,'number','step="any" min="0.01" required')+
   field('date','Date',p.date,'date','required')+selectF('mode','Mode',modeOpts(),p.mode)+field('receipt','Receipt no.',p.receipt)+field('ref','UPI / bank reference (optional)',p.ref),function(d){
    if(num(d.amount)<=0){alert('Enter an amount.');return false}
    p.flatId=d.flatId;p.amount=num(d.amount);p.date=d.date;p.mode=d.mode;p.receipt=d.receipt.trim();p.ref=d.ref.trim();
    if(isNew){p.id=uid();a.payments.push(p)}save();ui.month=d.date.slice(0,7);
  },{del:isNew?null:function(){a.payments=a.payments.filter(function(x){return x!==p});save()}});
}
function expSheet(e){
  var a=apt(),isNew=!e;
  e=e||{date:(ui.month===curMonth()?today():ui.month+'-01'),cat:CATS[0],amount:'',mode:'cash',note:''};
  sheet(isNew?'Add expense':'Edit expense',selectF('cat','Category',CATS.map(function(c){return [c,c]}),e.cat)+field('amount','Amount (\u20B9)',e.amount,'number','step="any" min="0.01" required')+
   field('date','Date',e.date,'date','required')+selectF('mode','Paid from',[['cash','Cash'],['bank','Bank / UPI']],e.mode)+field('note','Note (optional)',e.note),function(d){
    if(num(d.amount)<=0){alert('Enter an amount.');return false}
    e.cat=d.cat;e.amount=num(d.amount);e.date=d.date;e.mode=d.mode;e.note=d.note.trim();
    if(isNew){e.id=uid();a.expenses.push(e)}save();ui.month=d.date.slice(0,7);
  },{del:isNew?null:function(){a.expenses=a.expenses.filter(function(x){return x!==e});save()}});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){e.preventDefault();acts[t.dataset.act](t);return}
  var n=e.target.closest('#nav button');if(n){ui.tab=n.dataset.tab;render();window.scrollTo(0,0)}
});
$('#aptSel').onchange=function(){ui.apt=this.value;render()};
$('#monthSel').onchange=function(){if(this.value){ui.month=this.value;render()}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- self-test: open index.html?test ---------- */
function selfTest(){
  var out=[],ok=true;function eq(n,a,b){var p=Math.abs(a-b)<0.005;if(!p)ok=false;out.push((p?'PASS ':'FAIL ')+n+' got '+a+' want '+b)}
  var A={startMonth:'2026-10',openCash:1000,openBank:5000,flats:[],payments:[],expenses:[]};
  for(var i=1;i<=32;i++)A.flats.push({id:'f'+i,no:String(100+i),amount:2000,opening:0});
  A.flats[1].opening=500;A.flats[2].amount=2500;
  A.payments=[{flatId:'f1',date:'2026-10-05',amount:2000,mode:'cash'},{flatId:'f2',date:'2026-10-06',amount:1000,mode:'upi'},{flatId:'f3',date:'2026-10-07',amount:3000,mode:'bank'},{flatId:'f1',date:'2026-11-02',amount:2000,mode:'upi'},{flatId:'f4',date:'2026-10-09',amount:500,mode:'cash'}];
  A.expenses=[{date:'2026-10-10',amount:600,mode:'cash'},{date:'2026-10-11',amount:800,mode:'bank'},{date:'2026-11-03',amount:100,mode:'cash'}];
  var o=calc(A,'2026-10');
  eq('oct billed',o.t.billed,31*2000+2500);eq('oct paid',o.t.paid,2000+1000+3000+500);
  eq('f2 pending',o.rows[1].pending,500+2000-1000);eq('f3 advance',o.rows[2].pending,-500);
  eq('oct pending',o.t.pending,59000);
  eq('oct cash close',o.cashClose,1000+2000+500-600);eq('oct bank close',o.bankClose,5000+1000+3000-800);
  eq('defaulters',o.t.defaulters,30);
  var n=calc(A,'2026-11');
  eq('nov f1 pending',n.rows[0].pending,2000+2000-2000-2000+0);
  eq('nov f2 pending',n.rows[1].pending,500+4000-1000);eq('nov cash open',n.cashOpen,2900);eq('nov cash close',n.cashClose,2900-100);eq('nov bank close',n.bankClose,8200+2000);
  var b=calc(A,'2026-09');eq('before start billed',b.t.billed,0);
  var x=document.createElement('pre');x.id='testout';x.textContent=(ok?'ALL PASS\n':'FAILURES\n')+out.join('\n');document.body.prepend(x);
}
if(/[?&]test\b/.test(location.search)){selfTest()}else render();
